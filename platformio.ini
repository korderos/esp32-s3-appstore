; Waveshare ESP32-S3-Touch-LCD-3.49 V2 — firmwares de l'appstore
; Chaque application = un environnement [env:<id>] qui compile src/ (pilotes partagés)
; + src/apps/<id>/. Les métadonnées de l'app sont dans src/apps/<id>/app.json.
;
; Compiler une app et l'exporter vers l'appstore (docs/) :   pio run -e dessin
; Compiler et exporter toutes les apps :                     pio run
; Flasher directement en USB (sans l'appstore) :             pio run -e dessin -t upload

[platformio]
default_envs = test_ecran, dessin, cryptotracker, meteo, gladys

[env]
; pioarduino 55.03.30 = arduino-esp32 3.3.0 (ESP-IDF 5), version utilisée par les exemples Waveshare
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8 : flash 16 Mo QIO + PSRAM 8 Mo octale
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

lib_deps =
    lvgl/lvgl@8.4.0

; Serial = USB CDC natif (périphérique USB-Serial/JTAG) dès le boot
; lv_conf.h (repris de Waveshare) est dans include/
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

; Pilotes communs + uniquement le dossier de l'app de l'environnement courant
build_src_filter = +<*> -<apps/> +<apps/${PIOENV}/>

upload_port = COM10
; esptool 4.5.1 laisse la puce en mode téléchargement : reset watchdog après l'upload
; export_appstore.py copie les .bin + manifeste dans docs/firmware/<id>/ après chaque build
extra_scripts =
    pre:scripts/esptool_path.py
    post:scripts/reset_after_upload.py
    post:scripts/export_appstore.py
monitor_port = COM10
monitor_speed = 115200

[env:test_ecran]

[env:dessin]

; App autonome : son propre portage LVGL (paysage + retournement IMU) et ses pilotes,
; donc on n'utilise pas le display.c commun.
[env:cryptotracker]
build_src_filter = -<*> +<apps/cryptotracker/>
build_flags =
    ${env.build_flags}
    -I src/apps/cryptotracker
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7.2.0

; Même base matérielle que CryptoTracker (paysage + IMU), données Open-Meteo.
[env:meteo]
build_src_filter = -<*> +<apps/meteo/>
build_flags =
    ${env.build_flags}
    -I src/apps/meteo
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7.2.0

; Énergie et températures depuis Gladys Assistant (service MCP, clé API saisie sur le module).
[env:gladys]
build_src_filter = -<*> +<apps/gladys/>
build_flags =
    ${env.build_flags}
    -I src/apps/gladys
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7.2.0
